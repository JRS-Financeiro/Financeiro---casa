<style>
/* Layout: private-banking ledger. One hero figure per screen, side rail on desktop, tab bar on phone.
   Three skins share one token set: Esmeralda (ink-green + champagne gold, default),
   Safira (midnight navy + platinum), Pérola (pearl light + deep green and bronze).
   Tokens live on [data-skin] so the theme previews in Ajustes can render any skin. */
:root, [data-skin="esmeralda"] {
  --ink: #0B1210;
  --panel: #111a17;
  --panel-2: #17221e;
  --line: rgba(214, 186, 132, .16);
  --line-strong: rgba(214, 186, 132, .34);
  --fg: #EEE7D7;
  --muted: #9AA096;
  --faint: #6B726A;
  --gold: #D4B47A;
  --gold-hi: #F1DCAA;
  --btn-a: #F1DCAA; --btn-b: #D4B47A; --btn-ink: #1A140A;
  --good: #74C6A2;
  --warn: #E6AE5B;
  --bad: #E57A6E;
  --save: #93A6F2;
  --field: rgba(255, 255, 255, .03);
  --track: rgba(255, 255, 255, .06);
  --glass: rgba(11, 18, 16, .86);
  --scrim: rgba(4, 8, 7, .62);
  --check-ink: #0B1A13;
  --hero-a: #1D2A24; --hero-b: #121B18; --hero-c: #0F1714;
  --c-moradia: #D4B47A; --c-servicos: #7DB6DA; --c-mercado: #74C6A2; --c-combustivel: #E6AE5B; --c-saude: #CC93DA;
  --c-educacao: #93A6F2; --c-dividas: #E2846F; --c-lazer: #F094AE; --c-assinaturas: #5FCBC3; --c-outros: #A3AAA1;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px;
  color-scheme: dark;
}
[data-skin="safira"] {
  --ink: #090E1A;
  --panel: #10172A;
  --panel-2: #161F36;
  --line: rgba(168, 190, 236, .15);
  --line-strong: rgba(168, 190, 236, .33);
  --fg: #E9EDF6;
  --muted: #9CA5BA;
  --faint: #677089;
  --gold: #AFC4F2;
  --gold-hi: #DDE7FD;
  --btn-a: #E7EDFA; --btn-b: #B4C3E3; --btn-ink: #0B1122;
  --good: #6FCBA6;
  --warn: #E8B060;
  --bad: #EE7F7A;
  --save: #C8A6F4;
  --field: rgba(255, 255, 255, .035);
  --track: rgba(255, 255, 255, .07);
  --glass: rgba(9, 14, 26, .86);
  --scrim: rgba(3, 6, 14, .64);
  --check-ink: #07131A;
  --hero-a: #1C2847; --hero-b: #121A31; --hero-c: #0C1324;
  --c-moradia: #D8BE8A; --c-servicos: #7FC0E8; --c-mercado: #6FCBA6; --c-combustivel: #E8B060; --c-saude: #D29BE0;
  --c-educacao: #9DB0F6; --c-dividas: #EE8C78; --c-lazer: #F39AB4; --c-assinaturas: #62D0C8; --c-outros: #A7AEC0;
  color-scheme: dark;
}
[data-skin="perola"] {
  --ink: #F2F3EF;
  --panel: #FFFFFF;
  --panel-2: #FBFBF8;
  --line: rgba(22, 44, 34, .10);
  --line-strong: rgba(22, 44, 34, .22);
  --fg: #15211B;
  --muted: #5B665F;
  --faint: #879088;
  --gold: #94712F;
  --gold-hi: #6F521C;
  --btn-a: #234537; --btn-b: #15291F; --btn-ink: #F4EBD8;
  --good: #23845A;
  --warn: #B0721A;
  --bad: #C2453A;
  --save: #4E62C8;
  --field: #F7F8F4;
  --track: rgba(22, 44, 34, .08);
  --glass: rgba(255, 255, 255, .88);
  --scrim: rgba(18, 30, 24, .34);
  --check-ink: #FFFFFF;
  --hero-a: #234537; --hero-b: #183126; --hero-c: #11231B;
  --c-moradia: #9C7633; --c-servicos: #2C7DB3; --c-mercado: #23845A; --c-combustivel: #BC7718; --c-saude: #9A4DB0;
  --c-educacao: #4A5ECF; --c-dividas: #C2573D; --c-lazer: #C4436C; --c-assinaturas: #178F86; --c-outros: #6C766E;
  color-scheme: light;
}
/* Pérola keeps the hero as a dark green "card" on the light page */
[data-skin="perola"] .hero, [data-skin="perola"] .sp-hero {
  --fg: #F4EBD8; --muted: #B5BFB5; --gold: #D9BC86; --gold-hi: #F1DCAA; --good: #7FD0AB;
  --line-strong: rgba(241, 220, 170, .32); --track: rgba(255, 255, 255, .12);
  color: var(--fg); box-shadow: 0 18px 40px rgba(17, 35, 27, .18);
}
[data-skin="perola"] .card:not(.hero) { box-shadow: 0 1px 2px rgba(17, 35, 27, .04); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(900px 500px at 85% -10%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, color-mix(in srgb, var(--good) 6%, transparent), transparent 60%);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: lining-nums tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.serif { font-family: var(--display); }
.muted { color: var(--muted); }
small { font-size: 12.5px; }

/* ---------- Lock screen ---------- */
.lock { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lock-card { width: 100%; max-width: 400px; display: grid; gap: 22px; }
.monogram { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto;
  border: 1px solid var(--line-strong); background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--gold-hi) 18%, transparent), transparent 60%), var(--panel);
  font-family: var(--display); font-size: 40px; color: var(--gold-hi); box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 5%, transparent); }
.lock h1 { font-family: var(--display); font-size: 38px; text-align: center; letter-spacing: .01em; line-height: 1.05; }
.lock p.lead { text-align: center; color: var(--muted); margin: -10px 0 0; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); outline: none; transition: border-color .15s, background .15s; }
.input:focus { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 5%, transparent); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
select.input option { background: var(--panel); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 12px; border: 1px solid var(--line-strong); background: transparent; font-weight: 600; transition: background .15s, transform .1s; }
.btn:hover { background: color-mix(in srgb, var(--gold) 8%, transparent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, var(--btn-a), var(--btn-b)); color: var(--btn-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
.btn.sm { padding: 8px 12px; font-size: 13.5px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: progress; }
.lock-msg { min-height: 20px; text-align: center; font-size: 13.5px; color: var(--bad); }
.lock-foot { display: flex; gap: 8px; justify-content: center; align-items: center; color: var(--faint); font-size: 12.5px; text-align: center; }

/* ---------- Shell ---------- */
.shell { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.rail { display: none; }
.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 110px; max-width: 1080px; width: 100%; margin: 0 auto; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; background: linear-gradient(var(--ink) 70%, transparent); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .mono { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-family: var(--display); color: var(--gold-hi); font-size: 19px; flex: none; }
.brand b { font-family: var(--display); font-size: 21px; font-weight: 600; white-space: nowrap; }
.month { display: flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.month button { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.month button:hover { color: var(--gold-hi); background: color-mix(in srgb, var(--gold) 8%, transparent); }
.month span { min-width: 118px; text-align: center; font-weight: 600; font-size: 14px; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:hover { color: var(--gold-hi); }
.view { display: grid; gap: 18px; animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
.view-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.view-head h2 { font-family: var(--display); font-size: 34px; line-height: 1.05; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
.tab { border: 0; background: transparent; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; color: var(--faint); font-size: 11px; font-weight: 600; border-radius: 12px; }
.tab.on { color: var(--gold-hi); }
.tab.on .ic { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--gold) 45%, transparent)); }

@media (min-width: 900px) {
  .shell { grid-template-columns: 236px 1fr; }
  .tabs { display: none; }
  .rail { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 22px 16px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 55%, transparent); }
  .rail .brand { padding: 4px 8px 22px; }
  .rail .tab { display: flex; justify-items: start; gap: 12px; padding: 11px 12px; font-size: 14.5px; color: var(--muted); }
  .rail .tab:hover { background: color-mix(in srgb, var(--gold) 6%, transparent); color: var(--fg); }
  .rail .tab.on { background: color-mix(in srgb, var(--gold) 10%, transparent); color: var(--gold-hi); }
  .rail .spacer { flex: 1; }
  .main { padding-left: 32px; padding-right: 32px; padding-bottom: 48px; }
  .top .brand { visibility: hidden; }
}

/* ---------- Cards ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { padding: 15px 16px; display: grid; gap: 4px; }
.kpi .v { font-family: var(--display); font-size: 27px; font-weight: 600; line-height: 1.1; overflow-wrap: anywhere; }
.kpi .s { font-size: 12.5px; color: var(--muted); }

.hero { position: relative; overflow: hidden; padding: 24px 22px; border-color: var(--line-strong);
  background: linear-gradient(150deg, var(--hero-a) 0%, var(--hero-b) 55%, var(--hero-c) 100%); }
.hero::after { content: ""; position: absolute; inset: -40% -20% auto auto; width: 70%; height: 140%; background: radial-gradient(closest-side, color-mix(in srgb, var(--gold-hi) 14%, transparent), transparent); pointer-events: none; }
.hero .big { font-family: var(--display); font-size: clamp(44px, 9vw, 64px); font-weight: 600; line-height: 1; margin: 8px 0 18px; letter-spacing: -.01em; }
.hero .big .cur { font-size: .5em; color: var(--gold); margin-right: 6px; vertical-align: .55em; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; position: relative; z-index: 1; }
.split > div { display: grid; gap: 2px; }
.split .lbl { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.split .val { font-size: 21px; font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, var(--good), color-mix(in srgb, var(--good) 65%, #fff)); transition: width .6s ease; }
.bar.gold > i { background: linear-gradient(90deg, var(--gold), var(--gold-hi)); }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }
.hero .bar { margin: 18px 0 8px; position: relative; z-index: 1; }

/* Rows */
.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.row.late { border-color: color-mix(in srgb, var(--bad) 38%, transparent); }
.row.paid { opacity: .78; }
.row.paid .row-main b { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--fg) 30%, transparent); }
.cat-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.cat-ic .ic { width: 19px; height: 19px; }
.row-main { border: 0; background: transparent; text-align: left; padding: 0; min-width: 0; display: grid; gap: 1px; }
.row-main b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { display: grid; justify-items: end; gap: 3px; }
.row-end .amt { font-weight: 700; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--track); color: var(--muted); }
.pill.paid { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.pill.late { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.soon { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.pill.ex { background: color-mix(in srgb, var(--gold) 14%, transparent); color: var(--gold); }
.check { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: transparent; display: grid; place-items: center; color: transparent; transition: all .2s; }
.check:hover { border-color: var(--good); color: color-mix(in srgb, var(--good) 60%, transparent); }
.check.on { background: var(--good); border-color: var(--good); color: var(--check-ink); }
@media (max-width: 420px) { .row { gap: 10px; padding-left: 10px; } .cat-ic { width: 34px; height: 34px; } }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: transparent; padding: 7px 13px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip.on { border-color: var(--gold); color: var(--gold-hi); background: color-mix(in srgb, var(--gold) 10%, transparent); }
.chip .ic { width: 16px; height: 16px; }

.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px solid; }
.alert.late { border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: color-mix(in srgb, var(--bad) 7%, transparent); }
.alert.soon { border-color: color-mix(in srgb, var(--warn) 32%, transparent); background: color-mix(in srgb, var(--warn) 6%, transparent); }
.alert .ic { color: var(--c); }
.alert b { font-weight: 600; }
.alert small { display: block; color: var(--muted); }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; border-radius: 14px; border: 1px dashed var(--line-strong); background: color-mix(in srgb, var(--gold) 5%, transparent); font-size: 13.5px; }
.banner .ic { color: var(--gold); }
.banner > span { display: flex; gap: 10px; align-items: center; min-width: 0; flex: 1 1 240px; }

.tip { display: grid; gap: 8px; }
.tip q { font-family: var(--display); font-size: 22px; line-height: 1.25; quotes: "“" "”"; }
.tip .by { font-size: 12.5px; color: var(--gold); font-weight: 600; letter-spacing: .02em; }
.insight { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.insight:first-child { border-top: 0; padding-top: 0; }
.insight .ic { color: var(--c, var(--gold)); margin-top: 1px; }

/* 50/30/20 */
.rule { display: grid; gap: 14px; }
.rule-row { display: grid; gap: 6px; }
.rule-row .top-line { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; flex-wrap: wrap; }
.rule-row .bar { height: 10px; overflow: visible; }
.rule-row .bar > i { overflow: hidden; }
.rule-row .target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); opacity: .55; border-radius: 2px; }

/* Charts */
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; height: auto; min-width: 300px; }
.donut-wrap { display: grid; grid-template-columns: minmax(150px, 210px) minmax(0, 1fr); gap: 20px; align-items: center; }
@media (max-width: 520px) { .donut-wrap { grid-template-columns: 1fr; justify-items: center; } .legend { width: 100%; } }
.legend { display: grid; gap: 8px; }
.legend div { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 13.5px; }
.legend span.n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend .p { color: var(--muted); width: 42px; text-align: right; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
tr.cur td { color: var(--gold-hi); }

/* Expense quick add */
.amount-in { font-family: var(--display); font-size: 38px; font-weight: 600; padding: 6px 14px; }
.env { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
.env:first-child { border-top: 0; padding-top: 0; }
.env .line1 { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 14px; }
.env .line1 > span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.env small { color: var(--muted); }

async function deriveKey(user, pass, salt, iter = ITER, norm = normUser) {

/* ---------- regras de negócio ---------- */
const billsFor = m => S.bills.filter(b => b.rec ? (b.start <= m && (!b.end || b.end >= m)) : b.month === m).sort((a, b) => a.day - b.day || a.name.localeCompare(b.name));
const payOf = (b, m) => S.pays[b.id + "|" + m];
const dueDate = (b, m) => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, Math.min(b.day, daysIn(m))); };
function status(b, m) {
  if (payOf(b, m)) return { k: "paid", t: "Paga" };
  const d = Math.round((dueDate(b, m) - today0()) / 864e5);
  if (d < 0) return { k: "late", t: d === -1 ? "Venceu ontem" : `Atrasada ${-d} dias`, d };
  if (d === 0) return { k: "soon", t: "Vence hoje", d };
  if (d <= (b.remind ?? 3)) return { k: "soon", t: d === 1 ? "Vence amanhã" : `Vence em ${d} dias`, d };
  return { k: "open", t: "A pagar", d };
}
const billAmt = (b, m) => payOf(b, m)?.amount ?? b.amount;
const expsFor = m => S.exps.filter(e => e.date.startsWith(m)).sort((a, b) => b.date.localeCompare(a.date));
function totals(m) {
  const bs = billsFor(m);
  const paid = sum(bs.filter(b => payOf(b, m)).map(b => payOf(b, m).amount));
  const all = sum(bs.map(b => billAmt(b, m)));
  const exp = sum(expsFor(m).map(e => e.amount));
  return { bills: all, paid, open: all - paid, n: bs.length, nPaid: bs.filter(b => payOf(b, m)).length, exp, spent: all + exp };
}
function byCat(m) {
  const o = {};
  billsFor(m).forEach(b => o[b.cat] = (o[b.cat] || 0) + billAmt(b, m));
  expsFor(m).forEach(e => o[e.cat] = (o[e.cat] || 0) + e.amount);
  return o;
}
const hasData = m => billsFor(m).length > 0 || expsFor(m).length > 0;
function avgCat(m, cat, n = 3) {
  const ms = []; for (let i = 1; i <= n; i++) { const p = addMonth(m, -i); if (hasData(p)) ms.push(byCat(p)[cat] || 0); }
  return ms.length ? sum(ms) / ms.length : null;
}
function essentials(m) {
  const vals = []; for (let i = 0; i < 3; i++) { const p = addMonth(m, -i); if (hasData(p)) { const c = byCat(p); vals.push(sum(Object.keys(c).filter(k => CATS[k]?.g === "need").map(k => c[k]))); } }
  return vals.length ? sum(vals) / vals.length : 0;
}

function renderLock(msg = "") {
  S = null; K = null; SALT = null; closeSheet();
  const first = !store.get(VAULT_KEY);
  $app.innerHTML = `

      <div class="field"><label for="lgPass">Senha</label><input class="input" id="lgPass" name="password" type="password" autocomplete="current-password" required></div>
      <div class="lock-msg" id="lgMsg" role="alert">${esc(msg)}</div>
      <button class="btn primary block" id="lgBtn" type="submit">${ic("lock")} Entrar</button>
      <div class="lock-foot">${ic("shield")}<span>Dados criptografados neste aparelho (AES-256).<br>Ninguém lê suas informações sem a senha.</span></div>
    </form>
  </main>`;
  document.getElementById("lgUser").focus();
  document.getElementById("loginForm").addEventListener("submit", onLogin);
}
async function onLogin(e) {
  e.preventDefault();
  const u = document.getElementById("lgUser").value, p = document.getElementById("lgPass").value;
  const msg = document.getElementById("lgMsg"), btn = document.getElementById("lgBtn");
  const a = attempts();
  if (a.until > Date.now()) { msg.textContent = `Muitas tentativas. Aguarde ${Math.ceil((a.until - Date.now()) / 1000)} segundos.`; return; }
  if (!u || !p) { msg.textContent = "Preencha usuário e senha."; return; }
  btn.disabled = true; btn.innerHTML = "Verificando…"; msg.textContent = "";
  try {
    const raw = store.get(VAULT_KEY);
    if (!raw) {
      if (!(await checkDefault(u, p))) throw new Error("bad");
      SALT = crypto.getRandomValues(new Uint8Array(16));
      K = await deriveKey(u, p, SALT);
      S = seed(); save();
    } else {
      const vault = JSON.parse(raw);
      SALT = b64d(vault.salt);
      const it = vault.iter || ITER;
      try {
        K = await deriveKey(u, p, SALT, it);
        S = await openWith(K, vault);
      } catch {
        // Dados da primeira versão: usuário guardado com acento; acesso inicial era "Família"
        const tries = [[u, p]];
        if (await checkDefault(u, p)) tries.push([LEGACY_DEFAULT, LEGACY_DEFAULT]);
        for (const [lu, lp] of tries) { try { S = await openWith(await deriveKey(lu, lp, SALT, it, legacyUser), vault); break; } catch {} }
        if (!S) throw new Error("bad");
        SALT = crypto.getRandomValues(new Uint8Array(16));
        K = await deriveKey(u, p, SALT);
        S.user = normUser(u); save();
      }
    }
    store.del(LOCK_KEY);
    lastActive = Date.now(); view = "home"; month = ymOf(new Date());
    renderApp(); notifyDue();
  } catch {
    K = null; S = null;
    const f = registerFail();
    btn.disabled = false; btn.innerHTML = ic("lock") + " Entrar";
    msg.textContent = f.until > Date.now() ? `Usuário ou senha incorretos. Bloqueado por ${Math.ceil((f.until - Date.now()) / 1000)} segundos.` : `Usuário ou senha incorretos. ${Math.max(0, 5 - f.n)} tentativas antes do bloqueio.`;
    document.getElementById("lgPass").value = ""; document.getElementById("lgPass").focus();
  }
}
function lockNow(msg) { closeSheet(); renderLock(msg); }

function insights(m) {
  const out = [], t = totals(m), cats = byCat(m), inc = S.settings.income || 0;
  const late = billsFor(m).filter(b => status(b, m).k === "late");
  if (late.length) out.push(["alert", "var(--bad)", `${late.length} conta${late.length > 1 ? "s" : ""} em atraso (${money(sum(late.map(b => b.amount)))}). Pague primeiro para evitar multa e juros.`]);
  Object.entries(S.budgets).forEach(([k, lim]) => {
    if (!lim) return; const sp = sum(expsFor(m).filter(e => e.cat === k).map(e => e.amount)); const p = sp / lim;

function deleteBill(b) {
  const hasHistory = Object.keys(S.pays).some(k => k.startsWith(b.id + "|") && k.split("|")[1] < month);
  confirmBox("Excluir conta?", b.rec && hasHistory ? `“${b.name}” deixa de aparecer a partir de ${monthName(month)}. O histórico dos meses anteriores continua salvo.` : `“${b.name}” será removida.`, "Excluir", () => {
    if (b.rec && hasHistory) { b.end = addMonth(month, -1); Object.keys(S.pays).forEach(k => { if (k.startsWith(b.id + "|") && k.split("|")[1] >= month) delete S.pays[k]; }); }
    else { S.bills = S.bills.filter(x => x !== b); Object.keys(S.pays).forEach(k => { if (k.startsWith(b.id + "|")) delete S.pays[k]; }); }
    save(); rerender(); toast("Conta excluída");
  });
}

/* ---------- Análises ---------- */
function vReports() {
  const cats = byCat(month), entries = Object.entries(cats).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const total = sum(entries.map(e => e[1]));
  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonth(month, -i));
  const hist = []; for (let i = 0; i < 12; i++) { const m = addMonth(month, -i); if (hasData(m)) hist.push(m); }
  return `<section class="view">
    <div class="view-head"><div><span class="eyebrow">Histórico e gráficos</span><h2>Análises</h2></div></div>
    <div class="grid g2">
      <div class="card"><div class="card-head"><h3>Para onde foi o dinheiro</h3><span class="eyebrow">${esc(monthName(month, { month: "long" }))}</span></div>
        ${total ? `<div class="donut-wrap">${donut(entries, total)}<div class="legend">${entries.map(([k, v]) => `<div><i class="dot" style="background:${CATS[k]?.c}"></i><span class="n">${esc(CATS[k]?.n || k)}</span><span class="num">${money(v)}</span><span class="p num">${Math.round(v / total * 100)}%</span></div>`).join("")}</div></div>` : `<div class="empty">Sem lançamentos neste mês.</div>`}
      </div>
      <div class="card"><div class="card-head"><h3>Últimos 6 meses</h3>
        <span class="chips" style="gap:12px;font-size:12.5px"><span><i class="dot" style="background:var(--gold)"></i> Contas</span><span><i class="dot" style="background:var(--good)"></i> Dia a dia</span>${S.settings.income ? `<span><i class="dot" style="background:var(--fg);opacity:.6"></i> Renda</span>` : ""}</span></div>
        <div class="chart-wrap">${bars(months)}</div>
      </div>
    </div>
    <div class="card"><div class="card-head"><h3>Histórico mês a mês</h3><span class="muted">Toque num mês para abrir</span></div>
      <div class="table-wrap"><table class="num"><thead><tr><th>Mês</th><th>Contas</th><th>Pagas</th><th>Dia a dia</th><th>Total</th>${S.settings.income ? "<th>Sobra</th>" : ""}</tr></thead><tbody>
      ${hist.map(m => { const t = totals(m), l = (S.settings.income || 0) - t.spent; return `<tr class="${m === month ? "cur" : ""}"><td><button class="chip" data-act="goto" data-m="${m}" style="padding:4px 10px">${esc(monthName(m))}</button></td><td>${money(t.bills)}</td><td>${money(t.paid)}</td><td>${money(t.exp)}</td><td><b>${money(t.spent)}</b></td>${S.settings.income ? `<td style="color:${l >= 0 ? "var(--good)" : "var(--bad)"}">${money(l)}</td>` : ""}</tr>`; }).join("") || `<tr><td colspan="6" class="muted">Sem histórico ainda.</td></tr>`}
      </tbody></table></div>
    </div>
    <div class="card"><div class="card-head"><h3>Princípios da casa</h3><span class="eyebrow">O que os especialistas ensinam</span></div>
      <div class="grid g2">${TIPS.map(t => `<div class="tip" style="padding:14px;border:1px solid var(--line);border-radius:14px"><q style="font-size:19px">${esc(t.q)}</q><span class="by">${esc(t.by)}</span></div>`).join("")}</div>
    </div>
  </section>`;
}
function donut(entries, total) {
  const R = 70, C = 2 * Math.PI * R; let off = 0;
  const segs = entries.map(([k, v]) => { const len = v / total * C; const gap = entries.length > 1 ? Math.min(2, len / 3) : 0; const s = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${CATS[k]?.c}" stroke-width="22" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(CATS[k]?.n)}: ${money(v)}</title></circle>`; off += len; return s; }).join("");
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Gastos por categoria" style="width:100%;max-width:210px">
    <circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--track)" stroke-width="22"/>${segs}
    <text x="100" y="94" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="var(--body)" letter-spacing="1.5">TOTAL</text>
    <text x="100" y="120" text-anchor="middle" fill="var(--fg)" font-size="${total >= 10000 ? 22 : 25}" font-weight="600" font-family="var(--display)">${esc(money(total).replace(/,\d\d$/, ""))}</text></svg>`;
}
function bars(months) {
  const data = months.map(m => { const t = totals(m); return { m, b: t.bills, e: t.exp }; });
  const inc = S.settings.income || 0;
  const max = Math.max(inc, ...data.map(d => d.b + d.e), 1);
  const step = max > 12000 ? 5000 : max > 6000 ? 2000 : max > 2500 ? 1000 : 500;
  const top = Math.ceil(max * 1.05 / step) * step;
  const W = 520, H = 250, L = 52, Rr = 10, T = 14, B = 34, cw = (W - L - Rr) / data.length, bw = Math.min(42, cw * .52);
  const y = v => T + (H - T - B) * (1 - v / top);
  let grid = ""; for (let v = 0; v <= top; v += step) grid += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" fill="var(--faint)" font-size="11" font-family="var(--body)">${v >= 1000 ? (v / 1000) + " mil" : v}</text>`;
  const cols = data.map((d, i) => {
    const x = L + cw * i + (cw - bw) / 2, cur = d.m === month;
    const hb = y(0) - y(d.b), he = y(0) - y(d.e);
    return `<g opacity="${cur ? 1 : .78}"><rect x="${x}" y="${y(d.b)}" width="${bw}" height="${Math.max(0, hb)}" fill="var(--gold)" rx="3"><title>Contas: ${money(d.b)}</title></rect>
      <rect x="${x}" y="${y(d.b + d.e)}" width="${bw}" height="${Math.max(0, he)}" fill="var(--good)" rx="3"><title>Dia a dia: ${money(d.e)}</title></rect>
      ${d.b + d.e ? `<text x="${x + bw / 2}" y="${y(d.b + d.e) - 6}" text-anchor="middle" fill="${cur ? "var(--gold-hi)" : "var(--muted)"}" font-size="10.5" font-family="var(--body)" font-weight="600">${((d.b + d.e) / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}k</text>` : ""}
      <text x="${x + bw / 2}" y="${H - 12}" text-anchor="middle" fill="${cur ? "var(--gold-hi)" : "var(--muted)"}" font-size="12" font-family="var(--body)" font-weight="${cur ? 700 : 500}">${monthShort(d.m)}</text></g>`;
  }).join("");
  const incLine = inc ? `<line x1="${L}" x2="${W - Rr}" y1="${y(inc)}" y2="${y(inc)}" stroke="var(--fg)" stroke-opacity=".55" stroke-dasharray="5 5"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos dos últimos 6 meses">${grid}${cols}${incLine}</svg>`;
}

      <div class="card"><h3>Segurança</h3>
        <div class="set-row"><div><b>Usuário e senha</b><small>Use uma frase longa que só a família conheça</small></div><button class="btn sm" data-act="change-pw">${ic("lock")} Alterar</button></div>
        <div class="set-row"><div><b>Bloqueio automático</b><small>Fecha o app depois de um tempo parado</small></div><select class="input" id="sLock">${[1, 3, 5, 10, 15].map(n => `<option value="${n}" ${s.lockMin === n ? "selected" : ""}>${n} min</option>`).join("")}</select></div>
        <div class="set-row"><div><b>Bloquear agora</b><small>Pede a senha de novo</small></div><button class="btn sm" data-act="lock">${ic("logout")} Bloquear</button></div>
      </div>
      <div class="card"><h3>Lembretes</h3>
        <div class="set-row"><div><b>Alertas no aparelho</b><small>${notif === "granted" ? "Ativados. O app avisa ao abrir quando houver contas perto do vencimento." : notif === "denied" ? "Bloqueados nas configurações do navegador." : notif === "unsupported" ? "Este navegador não oferece alertas." : "Avisa ao abrir o app quando houver contas vencendo."}</small></div>${notif === "default" ? `<button class="btn sm" data-act="notif">${ic("bell")} Ativar</button>` : ""}</div>
        <div class="set-row"><div><b>Lembretes no calendário do celular</b><small>Baixa um arquivo .ics com todas as contas mensais. O calendário avisa no dia certo, mesmo com o app fechado.</small></div><button class="btn sm" data-act="ics">${ic("cal")} Baixar</button></div>
      </div>
      <div class="card"><h3>Seus dados</h3>
        <div class="set-row"><div><b>Cópia de segurança</b><small>Arquivo criptografado. Só abre com a senha atual.</small></div><button class="btn sm" data-act="export">${ic("download")} Exportar</button></div>
        <div class="set-row"><div><b>Restaurar cópia</b><small>Substitui os dados deste aparelho</small></div><button class="btn sm" data-act="import">${ic("upload")} Importar</button></div>
        ${S.bills.some(b => b.ex) || S.exps.some(e => e.ex) || s.exIncome ? `<div class="set-row"><div><b>Dados de exemplo</b><small>Remove contas e gastos fictícios</small></div><button class="btn sm" data-act="clear-examples">Limpar exemplos</button></div>` : ""}
        <div class="set-row"><div><b>Apagar tudo</b><small>Remove todos os dados deste aparelho</small></div><button class="btn sm danger" data-act="wipe">${ic("trash")} Apagar</button></div>
      </div>
    </div>
    <p class="muted" style="font-size:12.5px;margin:0">${ic("shield")} Os dados ficam só neste aparelho, criptografados com AES-256-GCM. A chave vem da sua senha (PBKDF2, 600 mil iterações) e nunca é gravada.</p>
  </section>`;
}
function changePwForm() {
  sheet(`<h3>Alterar acesso</h3><p class="muted" style="margin:0 0 16px">Use pelo menos 10 caracteres. Uma frase fácil de lembrar funciona bem, como “cafe-da-manha-de-domingo”.</p>
  <form class="form" id="pwForm" novalidate>
    <div class="field"><label for="pwCur">Senha atual</label><input class="input" id="pwCur" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="pwUser">Usuário</label><input class="input" id="pwUser" autocomplete="username" value="${esc(cap(S.user || "familia"))}"></div>
    <div class="field"><label for="pwNew">Nova senha</label><input class="input" id="pwNew" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="pwNew2">Repita a nova senha</label><input class="input" id="pwNew2" type="password" autocomplete="new-password"></div>
    <div class="lock-msg" id="pwMsg" style="text-align:left"></div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit" id="pwBtn">Salvar novo acesso</button></div>
  </form>`, el => {
    el.querySelector("#pwForm").onsubmit = async e => {
      e.preventDefault();
      const msg = el.querySelector("#pwMsg"), btn = el.querySelector("#pwBtn");
      const cur = el.querySelector("#pwCur").value, user = el.querySelector("#pwUser").value.trim(), n1 = el.querySelector("#pwNew").value, n2 = el.querySelector("#pwNew2").value;
      if (!user) return msg.textContent = "Informe o usuário.";
      if (n1.length < 10) return msg.textContent = "A nova senha precisa de pelo menos 10 caracteres.";
      if (n1 !== n2) return msg.textContent = "As duas senhas novas não são iguais.";
      if (normUser(n1) === "familia") return msg.textContent = "Escolha uma senha diferente da padrão.";
      btn.disabled = true; btn.textContent = "Protegendo…";
      try {
        const vault = JSON.parse(store.get(VAULT_KEY));
        const curKey = await deriveKey(S.user || "familia", cur, b64d(vault.salt), vault.iter || ITER);
        await openWith(curKey, vault);
      } catch { btn.disabled = false; btn.textContent = "Salvar novo acesso"; return msg.textContent = "A senha atual está incorreta."; }
      SALT = crypto.getRandomValues(new Uint8Array(16));
      K = await deriveKey(user, n1, SALT);
      S.user = normUser(user); S.defaultPw = false;
      save(); await saving;
      closeSheet(); rerender(); toast("Acesso alterado. Use a nova senha na próxima entrada.");
    };
  });
}
function reserveForm() {
  sheet(`<h3>Reserva de emergência</h3><p class="muted" style="margin:0 0 16px">Quanto a família tem guardado hoje em aplicações de resgate imediato.</p>
  <form class="form" id="resForm"><div class="field"><label for="rAmt">Valor guardado (R$)</label><input class="input amount-in num" id="rAmt" inputmode="decimal" value="${esc(fmtIn(S.settings.reserve))}"></div>
  <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>`, el => {
    el.querySelector("#resForm").onsubmit = e => { e.preventDefault(); const v = parseBRL(el.querySelector("#rAmt").value); S.settings.reserve = v > 0 ? v : 0; save(); closeSheet(); rerender(); toast("Reserva atualizada"); };
  });
}
function importForm() {
  sheet(`<h3>Restaurar cópia</h3><p class="muted" style="margin:0 0 16px">Escolha o arquivo exportado e digite a senha que estava em uso quando ele foi criado.</p>
  <form class="form" id="impForm" novalidate>
    <div class="field"><label for="iFile">Arquivo de cópia</label><input class="input" id="iFile" type="file" accept=".json,application/json"></div>
    <div class="field"><label for="iUser">Usuário da cópia</label><input class="input" id="iUser" value="${esc(cap(S.user || "familia"))}"></div>
    <div class="field"><label for="iPass">Senha da cópia</label><input class="input" id="iPass" type="password"></div>
    <div class="lock-msg" id="iMsg" style="text-align:left"></div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn primary" type="submit">Restaurar</button></div>
  </form>`, el => {
    el.querySelector("#impForm").onsubmit = async e => {
      e.preventDefault(); const msg = el.querySelector("#iMsg"); const f = el.querySelector("#iFile").files[0];
      if (!f) return msg.textContent = "Escolha o arquivo de cópia.";
      if (f.size > 5e6) return msg.textContent = "Arquivo grande demais para ser uma cópia do app.";
      try {
        const vault = JSON.parse(await f.text());
        const key = await deriveKey(el.querySelector("#iUser").value, el.querySelector("#iPass").value, b64d(vault.salt), vault.iter || ITER);
        const data = await openWith(key, vault);
        if (!data || !Array.isArray(data.bills) || !Array.isArray(data.exps)) throw 0;
        const keepUser = S.user, keepPw = S.defaultPw;
        S = data; S.user = keepUser; S.defaultPw = keepPw;
        save(); closeSheet(); rerender(); toast("Cópia restaurada");
      } catch { msg.textContent = "Não foi possível abrir. Confira o arquivo, o usuário e a senha."; }
    };
  });
}
function buildICS() {
  const now = new Date(), stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = S.bills.filter(b => b.rec && !b.end && !b.ex).map(b => {
    const m = b.start > ymOf(now) ? b.start : ymOf(now);
    const d = dueDate(b, m), ds = isoOf(d).replace(/-/g, "");
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const clean = s => s.replace(/[\\;,]/g, " ").replace(/\n/g, " ");
    return ["BEGIN:VEVENT", `UID:${b.id}@financas-da-familia`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ds}`, `DTEND;VALUE=DATE:${isoOf(next).replace(/-/g, "")}`,
      `RRULE:FREQ=MONTHLY;BYMONTHDAY=${b.day > 28 ? -1 : b.day}`, `SUMMARY:Pagar ${clean(b.name)}`, "DESCRIPTION:Abra o app Finanças da Família e marque como paga.",
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Conta vencendo", `TRIGGER:-P${b.remind || 3}D`, "END:VALARM", "END:VEVENT"].join("\r\n");
  });
  return ev.length ? ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Financas da Familia//PT-BR", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n") : null;
}
function notifyDue() {
  const t = isoOf(new Date());
  if (!("Notification" in window) || Notification.permission !== "granted" || S.notified === t) return;
  const m = ymOf(new Date());
  const due = billsFor(m).filter(b => ["late", "soon"].includes(status(b, m).k));
  if (!due.length) return;
  try { new Notification("Finanças da Família", { body: `${due.length} conta${due.length > 1 ? "s" : ""} pedindo atenção: ${due.slice(0, 3).map(b => b.name).join(", ")}${due.length > 3 ? "…" : ""}`, tag: "ff-due" }); } catch {}
  S.notified = t; save();
}

const VIEWS = { home: vHome, bills: vBills, exps: vExps, reports: vReports, settings: vSettings };

/* ---------- ações ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !S && el.dataset.act !== "close") return;
  const a = el.dataset.act, find = () => S.bills.find(b => b.id === el.dataset.id);
  switch (a) {
    case "nav": closeSheet(); view = el.dataset.v; renderApp(); window.scrollTo(0, 0); break;
    case "month": month = addMonth(month, +el.dataset.d); rerender(); break;
    case "goto": month = el.dataset.m; view = "home"; renderApp(); window.scrollTo(0, 0); break;
    case "lock": lockNow(""); break;
    case "close": closeSheet(); break;
    case "bill-filter": billFilter = el.dataset.f; rerender(); break;
    case "new-bill": billForm(null); break;
    case "edit-bill": billForm(find()); break;
    case "pay": payForm(find()); break;
    case "unpay": { const b = find(); confirmBox("Desmarcar pagamento?", `“${b.name}” volta a aparecer como não paga em ${monthName(month)}.`, "Desmarcar", () => { delete S.pays[b.id + "|" + month]; save(); rerender(); toast("Pagamento desmarcado"); }); break; }
    case "exp-cat": expCat = el.dataset.k; document.querySelectorAll('[data-act="exp-cat"]').forEach(c => { const on = c === el; c.classList.toggle("on", on); c.setAttribute("aria-checked", on); }); break;
    case "del-exp": { const x = S.exps.find(v => v.id === el.dataset.id); confirmBox("Apagar gasto?", `${x.desc || CATS[x.cat].n} · ${money(x.amount)}`, "Apagar", () => { S.exps = S.exps.filter(v => v !== x); save(); rerender(); toast("Gasto apagado"); }); break; }
    case "edit-budgets": budgetsForm(); break;
    case "edit-reserve": reserveForm(); break;
    case "save-settings": {
      const inc = parseBRL(document.getElementById("sInc").value), res = parseBRL(document.getElementById("sRes").value);
      S.settings.income = inc > 0 ? inc : 0; S.settings.reserve = res > 0 ? res : 0; S.settings.exIncome = false;
      S.settings.reserveMonths = +document.getElementById("sResM").value; save(); rerender(); toast("Orçamento salvo"); break;
    }
    case "change-pw": changePwForm(); break;
    case "skin": applySkin(el.dataset.s); store.set("ff_skin", skin); rerender(); toast(`Tema ${SKINS[skin].n} aplicado`); break;
    case "notif": Notification.requestPermission().then(() => { rerender(); notifyDue(); }); break;
    case "ics": { const ics = buildICS(); if (!ics) { toast("Cadastre contas mensais reais para gerar os lembretes."); break; } download("lembretes-contas.ics", ics, "text/calendar"); toast("Abra o arquivo baixado para adicionar ao calendário"); break; }
    case "export": { const raw = store.get(VAULT_KEY); if (raw) { download(`financas-familia-${isoOf(new Date())}.json`, raw, "application/json"); toast("Cópia criptografada exportada"); } break; }
    case "import": importForm(); break;
    case "clear-examples": confirmBox("Limpar dados de exemplo?", "As contas, pagamentos, gastos e a renda de exemplo serão removidos. O que você cadastrou continua.", "Limpar exemplos", () => {
      const exIds = new Set(S.bills.filter(b => b.ex).map(b => b.id));
      S.bills = S.bills.filter(b => !b.ex); S.exps = S.exps.filter(x => !x.ex);
      Object.keys(S.pays).forEach(k => { if (exIds.has(k.split("|")[0])) delete S.pays[k]; });
      if (S.settings.exIncome) { S.settings.income = 0; S.settings.reserve = 0; S.settings.exIncome = false; }
      save(); rerender(); toast("Exemplos removidos. Agora é com vocês.");
    }, false); break;
    case "wipe": confirmBox("Apagar todos os dados?", "Contas, gastos e histórico deste aparelho serão apagados para sempre. Exporte uma cópia antes, se quiser guardar.", "Apagar tudo", () => {
      store.del(VAULT_KEY); store.del(LOCK_KEY); lockNow("Dados apagados. Entre com o acesso inicial.");
    }); break;
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "expForm") return;
  e.preventDefault();
  const amt = parseBRL(document.getElementById("eAmt").value), msg = document.getElementById("eMsg");
  if (!(amt > 0)) { msg.textContent = "Digite o valor, por exemplo 87,50."; document.getElementById("eAmt").focus(); return; }
  const date = document.getElementById("eDate").value || isoOf(new Date());
  S.exps.push({ id: uid(), cat: expCat, desc: document.getElementById("eDesc").value.trim().slice(0, 60), amount: amt, date });
  if (!date.startsWith(month)) month = date.slice(0, 7);
  save(); rerender(); toast(`${CATS[expCat].n.split(" ")[0]}: ${money(amt)} lançado`);
  document.getElementById("eAmt")?.focus();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

if (!window.crypto?.subtle) {
  $app.innerHTML = `<main class="lock"><div class="lock-card"><div class="monogram">F</div><h1>Finanças da Família</h1><p class="lead">Abra o app por um endereço seguro (https) ou num navegador atualizado. A criptografia não está disponível aqui.</p></div></main>`;
} else renderLock();
})();
</script>
</body>
</html>
