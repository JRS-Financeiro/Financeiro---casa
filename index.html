<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--CSP-START-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<!--CSP-END-->
<meta name="theme-color" content="#F3F5F4" id="themeColor">
<title>Finanças da Família</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one job per screen. Home answers "what do we need to do now?",
   a center + button logs a purchase in seconds, everything else is one tap away.
   Three skins share one token set; tokens live on [data-skin] so previews can render any skin. */
:root, [data-skin="perola"] {
  --bg: #F3F5F4; --card: #FFFFFF; --card-2: #F6F8F7;
  --line: #E4E9E6; --line-2: #D2DAD5;
  --fg: #0F1A15; --muted: #5E6A64; --faint: #8D9892;
  --acc: #0E7A57; --acc-2: #0A5F43; --acc-ink: #FFFFFF; --acc-soft: #E1F2E9;
  --hero-a: #11533D; --hero-b: #0A3328; --hero-fg: #FFFFFF; --hero-muted: rgba(255,255,255,.72); --hero-acc: #7BE0B5;
  --good: #178A5B; --warn: #B26B00; --bad: #C8402F; --save: #4E62C8;
  --track: #EAEFEC; --glass: rgba(255,255,255,.88); --scrim: rgba(10,20,15,.38);
  --shadow: 0 1px 2px rgba(16,26,21,.04), 0 10px 28px rgba(16,26,21,.06);
  --c-moradia: #9C7633; --c-servicos: #2C7DB3; --c-mercado: #1F8A5C; --c-combustivel: #BC7718; --c-saude: #9A4DB0;
  --c-educacao: #4A5ECF; --c-dividas: #C2573D; --c-lazer: #C4436C; --c-assinaturas: #178F86; --c-outros: #6C766E;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
[data-skin="esmeralda"] {
  --bg: #0B1110; --card: #131B18; --card-2: #18221F;
  --line: #212D29; --line-2: #2D3B36;
  --fg: #EAF1ED; --muted: #98A59F; --faint: #66736D;
  --acc: #3CCB94; --acc-2: #7BE0B5; --acc-ink: #04140D; --acc-soft: rgba(60,203,148,.13);
  --hero-a: #16614A; --hero-b: #0C3428; --hero-fg: #FFFFFF; --hero-muted: rgba(255,255,255,.7); --hero-acc: #8FF0C6;
  --good: #3CCB94; --warn: #F0B44C; --bad: #F07264; --save: #9DB0F6;
  --track: #1E2925; --glass: rgba(11,17,16,.88); --scrim: rgba(0,0,0,.55);
  --shadow: 0 1px 0 rgba(255,255,255,.02);
  --c-moradia: #D4B47A; --c-servicos: #7DB6DA; --c-mercado: #74C6A2; --c-combustivel: #E6AE5B; --c-saude: #CC93DA;
  --c-educacao: #93A6F2; --c-dividas: #E2846F; --c-lazer: #F094AE; --c-assinaturas: #5FCBC3; --c-outros: #A3AAA1;
  color-scheme: dark;
}
[data-skin="safira"] {
  --bg: #0A0F1E; --card: #121A2E; --card-2: #172038;
  --line: #212B45; --line-2: #2C3855;
  --fg: #E8EDF7; --muted: #97A2BC; --faint: #626D88;
  --acc: #6E9BFF; --acc-2: #A9C2FF; --acc-ink: #061026; --acc-soft: rgba(110,155,255,.14);
  --hero-a: #2A4CB0; --hero-b: #14245C; --hero-fg: #FFFFFF; --hero-muted: rgba(255,255,255,.72); --hero-acc: #B8CCFF;
  --good: #43C99A; --warn: #F0B44C; --bad: #F27A72; --save: #C8A6F4;
  --track: #1C2540; --glass: rgba(10,15,30,.88); --scrim: rgba(0,0,0,.55);
  --shadow: 0 1px 0 rgba(255,255,255,.02);
  --c-moradia: #D8BE8A; --c-servicos: #7FC0E8; --c-mercado: #6FCBA6; --c-combustivel: #E8B060; --c-saude: #D29BE0;
  --c-educacao: #9DB0F6; --c-dividas: #EE8C78; --c-lazer: #F39AB4; --c-assinaturas: #62D0C8; --c-outros: #A7AEC0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

/* ---------- botões e campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--card); font-weight: 700; font-size: 14.5px; transition: transform .1s, background .15s; }
.btn:hover { background: var(--card-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--acc); border-color: transparent; color: var(--acc-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.soft { background: var(--acc-soft); border-color: transparent; color: var(--acc-2); }
[data-skin="perola"] .btn.soft { color: var(--acc); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--acc); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 8px 13px; font-size: 13.5px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn .ic { width: 18px; height: 18px; }
.field { display: grid; gap: 6px; }
.field > label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { width: 100%; padding: 13px 14px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--card-2); outline: none; transition: border-color .15s; font-size: 16px; }
.input:focus { border-color: var(--acc); background: var(--card); }
select.input { appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 19px) 55%, calc(100% - 14px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
select.input option { background: var(--card); }
.amount-in { font-size: 34px; font-weight: 800; text-align: center; padding: 14px; letter-spacing: -.02em; }
.err { min-height: 18px; font-size: 13.5px; color: var(--bad); font-weight: 600; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--fg); display: grid; place-items: center; flex: none; }
.iconbtn:hover { border-color: var(--line-2); }
.iconbtn.on { color: var(--acc); border-color: var(--acc); }
.hide-vals .secret-in:not(:focus) { -webkit-text-security: disc; }

/* ---------- login ---------- */
.lock { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.lock-card { width: 100%; max-width: 380px; display: grid; gap: 16px; }
.logo { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(150deg, var(--hero-a), var(--hero-b)); color: var(--hero-fg); box-shadow: var(--shadow); }
.logo .ic { width: 32px; height: 32px; stroke-width: 1.7; }
.lock h1 { font-size: 28px; font-weight: 800; margin-top: 8px; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 50px; }
.pw-wrap button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.lock-foot { display: flex; gap: 10px; align-items: center; color: var(--faint); font-size: 12.5px; padding-top: 6px; }
.lock-foot .ic { width: 18px; height: 18px; }

/* ---------- estrutura ---------- */
.shell { min-height: 100%; }
.rail { display: none; }
.main { min-width: 0; max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; background: var(--bg); }
.top-actions { display: flex; gap: 8px; }
.month { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.month button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.month button:hover { color: var(--fg); background: var(--card-2); }
.month span { min-width: 112px; text-align: center; font-weight: 700; font-size: 14px; }
.back { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; font-weight: 700; font-size: 16px; padding: 8px 6px 8px 0; }
.view { display: grid; gap: 22px; animation: rise .3s ease both; }
@keyframes rise { from { transform: translateY(8px); opacity: .7; } }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.page-head h2 { font-size: 26px; font-weight: 800; }
.sec { display: grid; gap: 12px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sec-head h3 { font-size: 17px; font-weight: 800; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.cols { display: grid; gap: 22px; }
@media (min-width: 980px) { .cols { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } .cols > div { display: grid; gap: 22px; min-width: 0; } }
@media (max-width: 979px) { .cols > div { display: contents; } }

/* barra de abas (celular) */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
.tab { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; color: var(--faint); font-size: 11.5px; font-weight: 700; }
.tab.on { color: var(--acc); }
.tab-add { justify-self: center; width: 58px; height: 58px; margin-top: -24px; border-radius: 20px; border: 0; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; box-shadow: 0 10px 24px color-mix(in srgb, var(--acc) 40%, transparent); }
.tab-add .ic { width: 28px; height: 28px; stroke-width: 2.3; }
@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  .tabs { display: none; }
  .rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--card); }
  .rail .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; font-weight: 800; font-size: 16px; }
  .rail .brand .logo { width: 36px; height: 36px; border-radius: 11px; }
  .rail .brand .logo .ic { width: 20px; height: 20px; }
  .rail .tab { display: flex; justify-items: start; gap: 12px; padding: 11px 12px; border-radius: 12px; font-size: 14.5px; color: var(--muted); }
  .rail .tab:hover { background: var(--card-2); color: var(--fg); }
  .rail .tab.on { background: var(--acc-soft); color: var(--acc); }
  .rail .btn { margin: 10px 4px; }
  .rail .spacer { flex: 1; }
  .main { padding-left: 36px; padding-right: 36px; padding-bottom: 48px; }
}

/* ---------- início ---------- */
.greet h1 { font-size: 24px; font-weight: 800; }
.greet p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.hero { position: relative; overflow: hidden; border: 0; color: var(--hero-fg); background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--hero-acc) 22%, transparent), transparent 55%), linear-gradient(150deg, var(--hero-a), var(--hero-b)); padding: 22px; box-shadow: 0 16px 36px color-mix(in srgb, var(--hero-b) 35%, transparent); }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; color: var(--hero-muted); }
.hero-top .iconbtn { width: 36px; height: 36px; background: rgba(255,255,255,.12); border-color: transparent; color: var(--hero-fg); }
.hero-main { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 6px; }
.big { font-size: clamp(34px, 9vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.big .cur { font-size: .48em; font-weight: 700; margin-right: 4px; opacity: .8; letter-spacing: 0; }
.hero-sub { color: var(--hero-muted); font-size: 14px; margin-top: 6px; }
.hero .peek .ic { color: var(--hero-muted); }
.ring-box { position: relative; flex: none; display: grid; place-items: center; }
.ring-box > div { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring-box b { font-size: 18px; font-weight: 800; }
.ring-box small { display: block; font-size: 11px; opacity: .75; font-weight: 600; }
.hero-done { margin-top: 14px; display: flex; gap: 8px; align-items: center; font-weight: 700; color: var(--hero-acc); font-size: 14.5px; }

.list { display: grid; gap: 2px; }
.card.list { padding: 6px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 16px; }
.row + .row { border-top: 1px solid var(--line); border-radius: 0; }
.cat-ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); flex: none; }
.cat-ic .ic { width: 20px; height: 20px; }
.row-main { border: 0; background: transparent; text-align: left; padding: 0; min-width: 0; display: grid; gap: 1px; }
.row-main b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main small { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.row-main small.good { color: var(--good); } .row-main small.bad { color: var(--bad); font-weight: 700; } .row-main small.warn { color: var(--warn); font-weight: 700; }
.row.paid .row-main b { color: var(--muted); }
.amt { font-weight: 800; white-space: nowrap; }
.check { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line-2); background: transparent; display: grid; place-items: center; color: transparent; transition: all .2s; }
.check:hover { border-color: var(--good); color: color-mix(in srgb, var(--good) 55%, transparent); }
.check.on { background: var(--good); border-color: var(--good); color: #fff; animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.15); } }
.xbtn { width: 34px; height: 34px; border: 0; background: transparent; color: var(--faint); border-radius: 50%; display: grid; place-items: center; }
.xbtn:hover { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty .ic { width: 30px; height: 30px; color: var(--acc); }

.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { display: grid; gap: 4px; padding: 16px; align-content: start; }
.mini .v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.mini small { font-size: 12.5px; color: var(--muted); }

.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.score .lvl { font-size: 19px; font-weight: 800; display: block; margin: 2px 0 6px; }
.chip-flame { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); font-size: 13px; font-weight: 700; }
.chip-flame .ic { width: 16px; height: 16px; }
.next { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 15px; border: 0; background: var(--card-2); font-weight: 600; font-size: 14px; }
.next .ic:first-child { color: var(--acc); }
.next span { flex: 1; min-width: 0; }
.next b { color: var(--good); white-space: nowrap; }

.steps-bar { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; margin: 10px 0 4px; }
.steps-bar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; transition: width .5s; }
.step { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 2px; border: 0; background: transparent; text-align: left; font-weight: 600; font-size: 14.5px; border-top: 1px solid var(--line); }
.step[disabled] { cursor: default; }
.step .dotc { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; color: transparent; }
.step.done { color: var(--muted); }
.step.done span { text-decoration: line-through; }
.step.done .dotc { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.step .dotc .ic { width: 14px; height: 14px; stroke-width: 3; }
.step > span:not(.dotc) { flex: 1; }
.step > .ic { color: var(--faint); width: 18px; height: 18px; }

.goals { display: grid; grid-auto-flow: column; grid-auto-columns: min(250px, 76%); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 8px; margin: -2px; scrollbar-width: none; }
.goals::-webkit-scrollbar { display: none; }
.goal { scroll-snap-align: start; display: grid; gap: 10px; align-content: start; }
.goal-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.goal b { font-size: 15.5px; font-weight: 800; display: block; }
.goal .meta { font-size: 13px; color: var(--muted); }
.goal .pct { font-size: 13px; font-weight: 800; color: var(--acc); }
.goal-add { border: 1.5px dashed var(--line-2); background: transparent; box-shadow: none; display: grid; place-items: center; align-content: center; gap: 8px; color: var(--acc); font-weight: 700; min-height: 150px; scroll-snap-align: start; }
.bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; display: block; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--acc); transition: width .6s ease; }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }
.bar.good > i { background: var(--good); }

.tip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.tip > .ic { color: var(--warn); margin-top: 2px; }
.tip p { font-weight: 600; font-size: 14.5px; }
.tip small { display: block; color: var(--muted); margin-top: 6px; font-size: 12.5px; }
.tip .btn { margin-top: 6px; padding: 4px 0; }

/* ---------- contas ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--track); }
.seg button { border: 0; background: transparent; padding: 9px 6px; border-radius: 11px; font-weight: 700; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.sum-strip { display: grid; gap: 10px; }
.sum-strip .line { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.sum-strip .line b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.group-title { font-size: 12.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 4px 4px -12px; }

/* ---------- gastos ---------- */
.env-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .env-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.env { display: grid; gap: 8px; padding: 14px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
.env.on { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.env .t { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; min-width: 0; }
.env .t span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  const P = Array.from({ length: 150 }, () => ({ x: W / 2 + (Math.random() - .5) * 120, y: H * .38, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 5, r: Math.random() * 6 + 5, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6, s: (Math.random() - .5) * .3 }));
  const t0 = performance.now();
  (function f(t) {
    const k = (t - t0) / 1000; x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - k / 2.4); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (k < 2.4) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function ring(p, size, stroke, color, track) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, h = size / 2;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(C * clamp(p, 0, 1)).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 ${h} ${h})"/></svg>`;
}

function renderLock(msg = "") {

  $app.innerHTML = `
  <main class="lock">
    <form class="lock-card" id="loginForm" autocomplete="on" novalidate>

      <div class="field"><label for="lgPass">Senha</label><div class="pw-wrap"><input class="input" id="lgPass" name="password" type="password" autocomplete="current-password" required><button type="button" id="pwToggle" aria-label="Mostrar senha">${ic("eye")}</button></div></div>
      <div class="err" id="lgMsg" role="alert">${esc(msg)}</div>
      <button class="btn primary block" id="lgBtn" type="submit">Entrar</button>
      <div class="lock-foot">${ic("shield")}<span>Dados criptografados neste aparelho. Ninguém lê suas informações sem a senha.</span></div>
    </form>
  </main>`;
  document.getElementById("lgUser").focus();
  document.getElementById("loginForm").addEventListener("submit", onLogin);
  document.getElementById("pwToggle").onclick = e => {
    const i = document.getElementById("lgPass"), show = i.type === "password";
    i.type = show ? "text" : "password"; e.currentTarget.innerHTML = ic(show ? "eye-off" : "eye");
    e.currentTarget.setAttribute("aria-label", show ? "Esconder senha" : "Mostrar senha");
  };
}
async function onLogin(e) {
  e.preventDefault();
  const u = document.getElementById("lgUser").value, p = document.getElementById("lgPass").value;
  const msg = document.getElementById("lgMsg"), btn = document.getElementById("lgBtn");
  const a = attempts();
  if (a.until > Date.now()) { msg.textContent = `Muitas tentativas. Aguarde ${Math.ceil((a.until - Date.now()) / 1000)} segundos.`; return; }
  if (!u || !p) { msg.textContent = "Preencha usuário e senha."; return; }
  btn.disabled = true; btn.textContent = "Verificando…"; msg.textContent = "";
  try {
    const raw = store.get(VAULT_KEY);
    if (!raw) {
      if (!(await checkDefault(u, p))) throw new Error("bad");
      SALT = crypto.getRandomValues(new Uint8Array(16));
      K = await deriveKey(u, p, SALT);
      S = seed();
    } else {
      const vault = JSON.parse(raw);
      SALT = b64d(vault.salt);
      const it = vault.iter || ITER;
      try {
        K = await deriveKey(u, p, SALT, it);
        S = await openWith(K, vault);
      } catch {
        // Dados da primeira versão: usuário guardado com acento; acesso inicial era "Família"
        const tries = [[u, p]];
        if (await checkDefault(u, p)) tries.push([LEGACY_DEFAULT, LEGACY_DEFAULT]);
        for (const [lu, lp] of tries) { try { S = await openWith(await deriveKey(lu, lp, SALT, it, legacyUser), vault); break; } catch {} }
        if (!S) throw new Error("bad");
        SALT = crypto.getRandomValues(new Uint8Array(16));
        K = await deriveKey(u, p, SALT);
        S.user = normUser(u);
      }
    }
    migrate(S); checkAch(); save();
    store.del(LOCK_KEY);
    lastActive = Date.now(); view = "home"; month = ymOf(new Date());
    renderApp(); notifyDue();
  } catch {
    K = null; S = null;
    const f = registerFail();
    btn.disabled = false; btn.textContent = "Entrar";
    msg.textContent = f.until > Date.now() ? `Usuário ou senha incorretos. Bloqueado por ${Math.ceil((f.until - Date.now()) / 1000)} segundos.` : `Usuário ou senha incorretos. ${Math.max(0, 5 - f.n)} tentativas antes do bloqueio.`;
    document.getElementById("lgPass").value = ""; document.getElementById("lgPass").focus();
  }
}
function lockNow(msg) { closeSheet(); renderLock(msg); }

  const hasHistory = Object.keys(S.pays).some(k => k.startsWith(b.id + "|") && k.split("|")[1] < month);

    if (b.rec && hasHistory) { b.end = addMonth(month, -1); Object.keys(S.pays).forEach(k => { if (k.startsWith(b.id + "|") && k.split("|")[1] >= month) delete S.pays[k]; }); }
    else { S.bills = S.bills.filter(x => x !== b); Object.keys(S.pays).forEach(k => { if (k.startsWith(b.id + "|")) delete S.pays[k]; }); }
    commit("Conta excluída");
  });
}
function payForm(b) {
  const dd = dueDate(b, month), t = today0();

  sheet(`<h3>Paguei</h3><p class="sub">${esc(b.name)} · ${esc(monthName(month))}</p>
  <form class="form" id="payForm" novalidate>

/* ---------- Gastos ---------- */
function vExps() {
  const list = expsFor(month), tot = sum(list.map(e => e.amount));
  const prev = []; for (let i = 1; i <= 3; i++) { const m = addMonth(month, -i); if (expsFor(m).length) prev.push(sum(expsFor(m).map(e => e.amount))); }
  const avg = prev.length ? sum(prev) / prev.length : 0;
  const delta = avg && month < ymOf(new Date()) ? (tot - avg) / avg : null;
  const cats = EXP_CATS.filter(k => S.budgets[k] > 0 || list.some(e => e.cat === k));
  const shown = expFilter ? list.filter(e => e.cat === expFilter) : list;
  const byDay = {}; shown.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  return `<section class="view">
    <div class="page-head"><h2>Gastos</h2><button class="btn sm" data-act="edit-budgets">${ic("target")} Limites</button></div>
    <div class="card sum-strip">
      <span class="label">Gastos do dia a dia em ${esc(monthName(month, { month: "long" }).toLowerCase())}</span>
      <div class="line"><b class="num" style="font-size:30px">${M(tot)}</b>${delta !== null && Math.abs(delta) >= .03 ? `<span class="delta ${delta < 0 ? "good" : "bad"}">${ic(delta < 0 ? "down" : "up")}${Math.round(Math.abs(delta) * 100)}% ${delta < 0 ? "abaixo" : "acima"} da média</span>` : ""}</div>
    </div>
    ${cats.length ? `<div class="env-grid">${cats.map(k => {
      const sp = spentIn(month, k), lim = S.budgets[k] || 0, p = pct(sp, lim);
      return `<button class="env ${expFilter === k ? "on" : ""}" data-act="exp-filter" data-k="${k}" aria-pressed="${expFilter === k}">
        <span class="t">${catIc(k)}<span>${CATS[k].s}</span></span>
        <span class="v num">${hideVals ? MASK : fmtMoney(sp)}</span>
        ${lim ? `<span class="bar ${p >= 1 ? "bad" : p >= .8 ? "warn" : ""}"><i style="width:${Math.min(100, p * 100).toFixed(1)}%"></i></span><small class="${p >= 1 ? "bad" : ""}">${p >= 1 ? "Passou do limite" : `${Math.round(p * 100)}% do limite`}</small>` : `<small>Sem limite</small>`}
      </button>`;
    }).join("")}</div>` : ""}
    <div class="sec">
      <div class="sec-head"><h3>${expFilter ? CATS[expFilter].n : "Lançamentos"}</h3>${expFilter ? `<button class="btn ghost sm" data-act="exp-filter" data-k="${expFilter}">Ver todos</button>` : ""}</div>
      ${shown.length ? `<div class="card list">${Object.keys(byDay).map(d => `<div class="day-head">${esc(cap(new Date(d + "T12:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "short" }).replace(".", "")))}</div>
        ${byDay[d].map(e => `<div class="row">${catIc(e.cat)}<div class="row-main"><b>${esc(e.desc || CATS[e.cat].n)}</b><small>${esc(CATS[e.cat].s)}${e.ex ? " · exemplo" : ""}</small></div>
          <span class="amt num">${M(e.amount, "n")}</span><button class="xbtn" data-act="del-exp" data-id="${e.id}" aria-label="Apagar gasto">${ic("x")}</button></div>`).join("")}`).join("")}</div>`
        : `<div class="card empty">${ic("wallet")}<span>Nenhum gasto lançado aqui ainda.</span><button class="btn primary" data-act="quick-add">${ic("plus")} Lançar gasto</button></div>`}
    </div>
  </section>`;
}
function quickAdd() {
  let cat = EXP_CATS.includes(expFilter) ? expFilter : "mercado";
  const hint = k => {
    const lim = S.budgets[k] || 0, sp = spentIn(ymOf(new Date()), k);
    return lim ? (sp >= lim ? `${CATS[k].s} já passou do limite deste mês.` : `${CATS[k].s}: restam ${money(lim - sp)} do limite deste mês.`) : "";

    <div class="hint" id="qaHint">${esc(hint(cat))}</div>

function budgetsForm() {

/* ---------- Sonhos ---------- */

    el.querySelector("#goalForm").onsubmit = e => {

  });
}
function goalSaveForm(g) {
  const left = Math.max(0, g.target - g.saved);
  sheet(`<h3>${esc(g.name)}</h3><p class="sub">${left ? `Faltam ${esc(money(left))} para realizar.` : "Sonho realizado!"}</p>
  <form class="form" id="gsForm" novalidate>
    <input class="input amount-in num" id="gsAmt" inputmode="decimal" placeholder="R$ 0,00" aria-label="Valor" autofocus>
    <div class="err" id="gsMsg"></div>
    <div class="two"><button class="btn" type="button" id="gsOut">Retirar</button><button class="btn primary" type="submit">${ic("plus")} Guardar</button></div>
  </form>`, el => {
    const go = sign => {
      const v = parseBRL(el.querySelector("#gsAmt").value);
      if (!(v > 0)) return el.querySelector("#gsMsg").textContent = "Digite um valor, por exemplo 200.";
      const was = g.saved >= g.target;
      g.saved = Math.max(0, Math.round((g.saved + sign * v) * 100) / 100);
      closeSheet(); buzz();
      if (!was && g.saved >= g.target) commit(`Sonho realizado: ${g.name}!`, true);
      else commit(sign > 0 ? `Guardado! ${Math.min(100, Math.round(pct(g.saved, g.target) * 100))}% do caminho.` : "Valor retirado");
    };
    el.querySelector("#gsForm").onsubmit = e => { e.preventDefault(); go(1); };
    el.querySelector("#gsOut").onclick = () => go(-1);
  });
}

/* ---------- Análises ---------- */
function vReports() {
  return `<section class="view">
    <div class="page-head"><h2>Análises</h2></div>
    <div class="seg" role="tablist">${[["resumo", "Resumo"], ["evolucao", "Evolução"], ["conquistas", "Conquistas"]].map(([k, n]) => `<button class="${repTab === k ? "on" : ""}" data-act="rep-tab" data-t="${k}" role="tab" aria-selected="${repTab === k}">${n}</button>`).join("")}</div>
    ${repTab === "resumo" ? repResumo() : repTab === "evolucao" ? repEvolucao() : repConquistas()}
  </section>`;
}
function repResumo() {
  const cats = byCat(month), entries = Object.entries(cats).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const total = sum(entries.map(e => e[1])), inc = S.settings.income || 0, t = totals(month), left = inc - t.spent;
  const need = sum(entries.filter(([k]) => CATS[k]?.g === "need").map(e => e[1])), want = total - need;
  const ess = essentials(month), goal = ess * (S.settings.reserveMonths || 6), rv = S.settings.reserve || 0;
  return `<div class="cols"><div>
    <div class="card"><div class="sec-head" style="margin-bottom:14px"><h3>Para onde foi o dinheiro</h3></div>
      ${total ? `<div class="donut-wrap">${donut(entries, total)}<div class="legend">${entries.map(([k, v]) => `<div><i class="dot" style="background:${CATS[k]?.c}"></i><span class="n">${esc(CATS[k]?.n || k)}</span><span class="num">${M(v, "n")}</span><span class="p num">${Math.round(v / total * 100)}%</span></div>`).join("")}</div></div>` : `<div class="empty">Sem lançamentos neste mês.</div>`}
    </div></div><div>
    <div class="card"><div class="sec-head" style="margin-bottom:16px"><h3>Regra 50/30/20</h3><span class="label">sobre a renda</span></div>
      ${inc ? `<div class="rule">
        ${ruleRow("Essencial", need / inc, .5, "var(--acc)", need, true)}
        ${ruleRow("Estilo de vida", want / inc, .3, "var(--warn)", want, true)}
        ${ruleRow("Poupança", Math.max(0, left) / inc, .2, "var(--save)", Math.max(0, left), false)}
      </div>` : `<p class="muted">Informe a renda para comparar com a regra.</p><button class="btn soft sm" data-act="budget-settings" style="margin-top:10px">Informar renda</button>`}
    </div>
    <div class="card"><div class="sec-head" style="margin-bottom:12px"><h3>Reserva de emergência</h3><button class="btn ghost sm" data-act="budget-settings">Atualizar</button></div>
      ${ess ? `<div style="display:grid;gap:10px"><b class="num" style="font-size:24px">${M(rv)}</b>
        <div class="bar"><i style="width:${Math.min(100, pct(rv, goal) * 100).toFixed(1)}%"></i></div>
        <small class="muted">Cobre ${(rv / ess).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} de ${S.settings.reserveMonths || 6} meses do custo essencial.${rv < goal ? ` Faltam ${esc(money(goal - rv))}.` : " Meta atingida!"}</small></div>` : `<p class="muted">Cadastre as contas para calcular a meta.</p>`}
    </div>
  </div></div>`;
}
function ruleRow(name, v, target, color, amount, overIsBad) {
  const over = overIsBad ? v > target : v < target;
  return `<div class="rule-row">
    <div class="tl"><span>${name} <span class="muted num" style="font-weight:500">· ${M(amount, "n")}</span></span><span class="num"><b class="${over ? "warn" : ""}">${Math.round(v * 100)}%</b> <span class="muted" style="font-weight:500">de ${Math.round(target * 100)}%</span></span></div>
    <div class="bar"><i style="width:${Math.min(100, v * 100).toFixed(1)}%;background:${color}"></i><span class="target" style="left:${target * 100}%"></span></div>
  </div>`;
}
function repEvolucao() {
  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonth(month, -i));
  const hist = []; for (let i = 0; i < 12; i++) { const m = addMonth(month, -i); if (hasData(m)) hist.push(m); }
  const inc = S.settings.income || 0;
  return `<div class="card"><div class="sec-head" style="margin-bottom:10px"><h3>Últimos 6 meses</h3>
      <span style="display:flex;gap:12px;font-size:12.5px;font-weight:600;flex-wrap:wrap" class="muted"><span><i class="dot" style="background:var(--acc)"></i> Contas</span><span><i class="dot" style="background:var(--warn)"></i> Dia a dia</span>${inc ? `<span>- - Renda</span>` : ""}</span></div>
      <div class="chart-wrap">${bars(months)}</div></div>
    <div class="card"><div class="sec-head" style="margin-bottom:6px"><h3>Mês a mês</h3></div>
      <div class="table-wrap"><table class="num"><thead><tr><th>Mês</th><th>Contas</th><th>Dia a dia</th><th>Total</th>${inc ? "<th>Sobra</th>" : ""}</tr></thead><tbody>
      ${hist.map(m => { const t = totals(m), l = inc - t.spent; return `<tr class="${m === month ? "cur" : ""}"><td><button data-act="goto" data-m="${m}">${esc(monthName(m))}</button></td><td>${M(t.bills, "n")}</td><td>${M(t.exp, "n")}</td><td><b>${M(t.spent, "n")}</b></td>${inc ? `<td class="${l >= 0 ? "good" : "bad"}">${M(l, "n")}</td>` : ""}</tr>`; }).join("") || `<tr><td colspan="5" class="muted">Sem histórico ainda.</td></tr>`}
      </tbody></table></div></div>`;
}
function repConquistas() {
  const sc = scoreInfo(), st = streak(), got = ACH.filter(a => S.ach[a.id]).length;
  return `<div class="cols"><div>
    <div class="card"><div class="sec-head" style="margin-bottom:14px"><h3>Como a nota é calculada</h3><b style="color:${sc.lvl[1]}">${sc.total} pontos</b></div>
      <div style="display:grid;gap:14px">${sc.parts.map(([n, v, max]) => `<div class="part"><div class="tl"><span>${n}</span><span class="num muted">${Math.round(v)} de ${max}</span></div><div class="bar"><i style="width:${(v / max * 100).toFixed(1)}%"></i></div></div>`).join("")}</div>
      ${st ? `<div style="margin-top:16px"><span class="chip-flame">${ic("flame")} ${plural(st, "mês", "meses")} seguidos sem atraso</span></div>` : ""}
    </div>
    <details class="card tips"><summary>Princípios dos especialistas ${ic("right")}</summary>${TIPS.map(t => `<div class="tip-item"><p>${esc(t.q)}</p><small>${esc(t.by)}</small></div>`).join("")}</details>
  </div><div>
    <div class="sec"><div class="sec-head"><h3>Conquistas</h3><span class="label">${got} de ${ACH.length}</span></div>
      <div class="badges">${ACH.map(a => {
        const ok = !!S.ach[a.id], pr = a.prog && !ok ? a.prog() : null;
        return `<div class="badge ${ok ? "" : "lock"}"><span class="bi">${ic(ok ? a.i : "lock")}</span><b>${a.n}</b><small>${a.d}</small>${pr ? `<div class="bar"><i style="width:${Math.min(100, pct(pr[0], pr[1]) * 100).toFixed(0)}%"></i></div>` : ""}</div>`;
      }).join("")}</div></div>
  </div></div>`;
}
function donut(entries, total) {
  const R = 70, C = 2 * Math.PI * R; let off = 0;
  const segs = entries.map(([k, v]) => { const len = v / total * C; const gap = entries.length > 1 ? Math.min(2.5, len / 3) : 0; const s = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${CATS[k]?.c}" stroke-width="24" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(CATS[k]?.n)}: ${esc(money(v))}</title></circle>`; off += len; return s; }).join("");
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Gastos por categoria" style="width:100%;max-width:190px">
    <circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--track)" stroke-width="24"/>${segs}
    <text x="100" y="94" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="600" font-family="var(--font)">Total</text>
    <text x="100" y="118" text-anchor="middle" fill="var(--fg)" font-size="${total >= 10000 ? 20 : 22}" font-weight="800" font-family="var(--font)">${hideVals ? MASK : esc(fmtMoney(total).replace(/,\d\d$/, ""))}</text></svg>`;
}
function bars(months) {
  const data = months.map(m => { const t = totals(m); return { m, b: t.bills, e: t.exp }; });
  const inc = S.settings.income || 0;
  const max = Math.max(inc, ...data.map(d => d.b + d.e), 1);
  const step = max > 12000 ? 5000 : max > 6000 ? 2000 : max > 2500 ? 1000 : 500;
  const top = Math.ceil(max * 1.05 / step) * step;
  const W = 520, H = 240, L = hideVals ? 12 : 48, Rr = 10, T = 16, B = 32, cw = (W - L - Rr) / data.length, bw = Math.min(40, cw * .5);
  const y = v => T + (H - T - B) * (1 - v / top);
  let grid = ""; for (let v = 0; v <= top; v += step) grid += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>${hideVals ? "" : `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" fill="var(--faint)" font-size="11" font-family="var(--font)">${v >= 1000 ? (v / 1000) + " mil" : v}</text>`}`;
  const cols = data.map((d, i) => {
    const x = L + cw * i + (cw - bw) / 2, cur = d.m === month;
    return `<g opacity="${cur ? 1 : .55}"><rect x="${x}" y="${y(d.b)}" width="${bw}" height="${Math.max(0, y(0) - y(d.b))}" fill="var(--acc)" rx="4"><title>Contas: ${esc(money(d.b))}</title></rect>
      <rect x="${x}" y="${y(d.b + d.e)}" width="${bw}" height="${Math.max(0, y(0) - y(d.e) - 2)}" fill="var(--warn)" rx="4"><title>Dia a dia: ${esc(money(d.e))}</title></rect>
      ${d.b + d.e && !hideVals ? `<text x="${x + bw / 2}" y="${y(d.b + d.e) - 6}" text-anchor="middle" fill="var(--muted)" font-size="10.5" font-family="var(--font)" font-weight="700">${((d.b + d.e) / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}k</text>` : ""}
      <text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" fill="${cur ? "var(--fg)" : "var(--muted)"}" font-size="12" font-family="var(--font)" font-weight="${cur ? 800 : 600}">${monthShort(d.m)}</text></g>`;
  }).join("");
  const incLine = inc ? `<line x1="${L}" x2="${W - Rr}" y1="${y(inc)}" y2="${y(inc)}" stroke="var(--fg)" stroke-opacity=".45" stroke-dasharray="5 5"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos dos últimos 6 meses">${grid}${cols}${incLine}</svg>`;
}

/* ---------- Ajustes ---------- */
function vSettings() {
  const s = S.settings;
  const notif = "Notification" in window ? Notification.permission : "unsupported";
  const row = (icon, title, desc, right, act, cls = "") => `<button class="set-row ${cls}" ${act ? `data-act="${act}"` : "disabled"}><span class="si">${ic(icon)}</span><div><b>${title}</b>${desc ? `<small>${desc}</small>` : ""}</div>${right || ""}${act ? ic("right", "chev") : ""}</button>`;
  const hasEx = S.bills.some(b => b.ex) || S.exps.some(e => e.ex) || S.goals.some(g => g.ex) || s.exIncome;
  return `<section class="view">
    <div class="card set-group"><h3>Aparência</h3>
      <div class="skins" role="radiogroup" aria-label="Tema do app">${Object.entries(SKINS).map(([k, v]) => `<button class="skin ${skin === k ? "on" : ""}" data-act="skin" data-s="${k}" role="radio" aria-checked="${skin === k}">
        <span class="skin-prev" data-skin="${k}" aria-hidden="true"><span class="sp-hero"></span><span class="sp-row"><i></i><b></b></span><span class="sp-row"><i></i><b></b></span></span>${v.n}</button>`).join("")}</div>
    </div>
    <div class="card set-group"><h3>Orçamento</h3>
      ${row("wallet", "Renda mensal", "Salários e outras entradas", `<span class="val num">${s.income ? esc(money(s.income)) : "Informar"}</span>`, "budget-settings")}
      ${row("piggy", "Reserva de emergência", `Meta: ${s.reserveMonths || 6} meses do essencial`, `<span class="val num">${esc(money(s.reserve || 0))}</span>`, "budget-settings")}
      ${row("target", "Limites de gastos", "Quanto gastar em cada categoria", "", "edit-budgets")}
    </div>
    <div class="card set-group"><h3>Segurança</h3>
      ${row("key", "Usuário e senha", S.defaultPw ? '<span class="bad">Ainda é a senha padrão. Troque agora.</span>' : "Senha própria da família", "", "change-pw")}
      <div class="set-row"><span class="si">${ic("clock")}</span><div><b>Bloqueio automático</b><small>Fecha o app depois de um tempo parado</small></div><select class="input" id="sLock" aria-label="Tempo do bloqueio">${[1, 3, 5, 10, 15].map(n => `<option value="${n}" ${s.lockMin === n ? "selected" : ""}>${n} min</option>`).join("")}</select></div>
      ${row("lock", "Bloquear agora", "", "", "lock")}
    </div>
    <div class="card set-group"><h3>Lembretes</h3>
      ${row("bell", "Alertas no aparelho", notif === "granted" ? "Ativados" : notif === "denied" ? "Bloqueados nas configurações do navegador" : notif === "unsupported" ? "Este navegador não oferece alertas" : "Avisa ao abrir o app quando houver contas vencendo", "", notif === "default" ? "notif" : "")}
      ${row("cal", "Lembretes no calendário do celular", "Baixa um arquivo com as contas mensais. O calendário avisa mesmo com o app fechado.", "", "ics")}
    </div>
    <div class="card set-group"><h3>Dados</h3>
      ${row("download", "Exportar cópia de segurança", "Arquivo criptografado, só abre com a senha", "", "export")}
      ${row("upload", "Restaurar cópia", "Substitui os dados deste aparelho", "", "import")}
      ${hasEx ? row("x", "Apagar dados de exemplo", "Mantém o que vocês cadastraram", "", "clear-examples") : ""}
      ${row("trash", "Apagar tudo", "Remove todos os dados deste aparelho", "", "wipe", "danger")}
    </div>
    <p class="muted" style="font-size:12.5px;text-align:center">Dados só neste aparelho, criptografados com AES-256. A chave vem da senha e nunca é gravada.</p>
  </section>`;
}
function budgetSettingsForm() {
  const s = S.settings;
  sheet(`<h3>Orçamento da família</h3><p class="sub">Usado na nota da família, na regra 50/30/20 e na reserva.</p>
  <form class="form" id="bsForm" novalidate>
    <div class="field"><label for="sInc">Renda mensal da família</label><input class="input num secret-in" id="sInc" inputmode="decimal" value="${esc(fmtIn(s.income))}" placeholder="0,00" autofocus></div>
    <div class="field"><label for="sRes">Reserva guardada hoje</label><input class="input num secret-in" id="sRes" inputmode="decimal" value="${esc(fmtIn(s.reserve))}" placeholder="0,00"></div>
    <div class="field"><label for="sResM">Meta da reserva</label><select class="input" id="sResM">${[3, 6, 9, 12].map(n => `<option value="${n}" ${s.reserveMonths === n ? "selected" : ""}>${n} meses do custo essencial</option>`).join("")}</select></div>
    <button class="btn primary block" type="submit">Salvar</button>
  </form>`, el => {
    el.querySelector("#bsForm").onsubmit = e => {
      e.preventDefault();
      const inc = parseBRL(el.querySelector("#sInc").value), res = parseBRL(el.querySelector("#sRes").value);
      s.income = inc > 0 ? inc : 0; s.reserve = res > 0 ? res : 0; s.exIncome = false; s.reserveMonths = +el.querySelector("#sResM").value;
      closeSheet(); commit("Orçamento salvo");
    };
  });
}
function changePwForm() {
  sheet(`<h3>Senha da família</h3><p class="sub">Use pelo menos 10 caracteres. Uma frase fácil de lembrar funciona bem, como “cafe-da-manha-de-domingo”.</p>
  <form class="form" id="pwForm" novalidate>
    <div class="field"><label for="pwCur">Senha atual</label><input class="input" id="pwCur" type="password" autocomplete="current-password" autofocus></div>
    <div class="field"><label for="pwUser">Usuário</label><input class="input" id="pwUser" autocomplete="username" value="${esc(cap(S.user || "familia"))}"></div>
    <div class="field"><label for="pwNew">Nova senha</label><input class="input" id="pwNew" type="password" autocomplete="new-password"></div>
    <div class="field"><label for="pwNew2">Repita a nova senha</label><input class="input" id="pwNew2" type="password" autocomplete="new-password"></div>
    <div class="err" id="pwMsg"></div>
    <button class="btn primary block" type="submit" id="pwBtn">Salvar nova senha</button>
  </form>`, el => {
    el.querySelector("#pwForm").onsubmit = async e => {
      e.preventDefault();
      const msg = el.querySelector("#pwMsg"), btn = el.querySelector("#pwBtn");
      const cur = el.querySelector("#pwCur").value, user = el.querySelector("#pwUser").value.trim(), n1 = el.querySelector("#pwNew").value, n2 = el.querySelector("#pwNew2").value;
      if (!user) return msg.textContent = "Informe o usuário.";
      if (n1.length < 10) return msg.textContent = "A nova senha precisa de pelo menos 10 caracteres.";
      if (n1 !== n2) return msg.textContent = "As duas senhas novas não são iguais.";
      if (normUser(n1) === "familia") return msg.textContent = "Escolha uma senha diferente da padrão.";
      btn.disabled = true; btn.textContent = "Protegendo…";
      try {
        await saving;
        const vault = JSON.parse(store.get(VAULT_KEY));
        await openWith(await deriveKey(S.user || "familia", cur, b64d(vault.salt), vault.iter || ITER), vault);
      } catch { btn.disabled = false; btn.textContent = "Salvar nova senha"; return msg.textContent = "A senha atual está incorreta."; }
      SALT = crypto.getRandomValues(new Uint8Array(16));
      K = await deriveKey(user, n1, SALT);
      S.user = normUser(user); S.defaultPw = false;
      closeSheet(); commit("Senha alterada. Seus dados estão protegidos.");
    };
  });
}
function importForm() {
  sheet(`<h3>Restaurar cópia</h3><p class="sub">Escolha o arquivo exportado e digite a senha que estava em uso quando ele foi criado.</p>
  <form class="form" id="impForm" novalidate>
    <div class="field"><label for="iFile">Arquivo de cópia</label><input class="input" id="iFile" type="file" accept=".json,application/json"></div>
    <div class="field"><label for="iUser">Usuário da cópia</label><input class="input" id="iUser" value="${esc(cap(S.user || "familia"))}"></div>
    <div class="field"><label for="iPass">Senha da cópia</label><input class="input" id="iPass" type="password"></div>
    <div class="err" id="iMsg"></div>
    <button class="btn primary block" type="submit">Restaurar</button>
  </form>`, el => {
    el.querySelector("#impForm").onsubmit = async e => {
      e.preventDefault(); const msg = el.querySelector("#iMsg"); const f = el.querySelector("#iFile").files[0];
      if (!f) return msg.textContent = "Escolha o arquivo de cópia.";
      if (f.size > 5e6) return msg.textContent = "Arquivo grande demais para ser uma cópia do app.";
      try {
        const vault = JSON.parse(await f.text());
        const data = await openWith(await deriveKey(el.querySelector("#iUser").value, el.querySelector("#iPass").value, b64d(vault.salt), vault.iter || ITER), vault);
        if (!data || !Array.isArray(data.bills) || !Array.isArray(data.exps)) throw 0;
        const keepUser = S.user, keepPw = S.defaultPw;
        S = migrate(data); S.user = keepUser; S.defaultPw = keepPw;
        closeSheet(); commit("Cópia restaurada");
      } catch { msg.textContent = "Não foi possível abrir. Confira o arquivo, o usuário e a senha."; }
    };
  });
}
function buildICS() {
  const now = new Date(), stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = S.bills.filter(b => b.rec && !b.end && !b.ex).map(b => {
    const m = b.start > ymOf(now) ? b.start : ymOf(now);
    const d = dueDate(b, m), ds = isoOf(d).replace(/-/g, "");
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const clean = s => s.replace(/[\\;,]/g, " ").replace(/\n/g, " ");
    return ["BEGIN:VEVENT", `UID:${b.id}@financas-da-familia`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ds}`, `DTEND;VALUE=DATE:${isoOf(next).replace(/-/g, "")}`,
      `RRULE:FREQ=MONTHLY;BYMONTHDAY=${b.day > 28 ? -1 : b.day}`, `SUMMARY:Pagar ${clean(b.name)}`, "DESCRIPTION:Abra o app Finanças da Família e marque como paga.",
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Conta vencendo", `TRIGGER:-P${b.remind || 3}D`, "END:VALARM", "END:VEVENT"].join("\r\n");
  });
  return ev.length ? ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Financas da Familia//PT-BR", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n") : null;
}
function notifyDue() {
  const t = isoOf(new Date());
  if (!("Notification" in window) || Notification.permission !== "granted" || S.notified === t) return;
  const m = ymOf(new Date());
  const due = billsFor(m).filter(b => ["late", "soon"].includes(status(b, m).k));
  if (!due.length) return;
  try { new Notification("Finanças da Família", { body: `${plural(due.length, "conta pedindo", "contas pedindo")} atenção: ${due.slice(0, 3).map(b => b.name).join(", ")}${due.length > 3 ? "…" : ""}`, tag: "ff-due" }); } catch {}
  S.notified = t; save();
}

const VIEWS = { home: vHome, bills: vBills, exps: vExps, reports: vReports, settings: vSettings };

/* ---------- ações ---------- */
function nav(v) { closeSheet(); if (v === "settings" && view !== "settings") prevView = view; view = v; renderApp(); window.scrollTo(0, 0); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !S && el.dataset.act !== "close") return;
  const a = el.dataset.act, find = () => S.bills.find(b => b.id === el.dataset.id), goal = () => S.goals.find(g => g.id === el.dataset.id);
  switch (a) {
    case "nav": nav(el.dataset.v); break;
    case "nav-settings": nav("settings"); break;
    case "go": { const g = el.dataset.g; if (g === "bills") { billFilter = "open"; nav("bills"); } else if (g === "exps") nav("exps"); else if (g === "edit-budgets") budgetsForm(); else budgetSettingsForm(); break; }
    case "month": month = addMonth(month, +el.dataset.d); rerender(); break;
    case "goto": month = el.dataset.m; nav("home"); break;
    case "lock": lockNow(""); break;
    case "close": closeSheet(); break;
    case "quick-add": quickAdd(); break;
    case "bill-filter": billFilter = el.dataset.f; rerender(); break;
    case "exp-filter": expFilter = expFilter === el.dataset.k ? "" : el.dataset.k; rerender(); break;
    case "rep-tab": repTab = el.dataset.t; rerender(); break;
    case "new-bill": billForm(null); break;
    case "edit-bill": billForm(find()); break;
    case "pay": payForm(find()); break;
    case "unpay": { const b = find(); confirmBox("Desmarcar pagamento?", `“${b.name}” volta a aparecer como não paga em ${monthName(month)}.`, "Desmarcar", () => { delete S.pays[b.id + "|" + month]; commit("Pagamento desmarcado"); }); break; }
    case "del-exp": { const x = S.exps.find(v => v.id === el.dataset.id); confirmBox("Apagar gasto?", `${x.desc || CATS[x.cat].n} · ${money(x.amount)}`, "Apagar", () => { S.exps = S.exps.filter(v => v !== x); commit("Gasto apagado"); }); break; }
    case "edit-budgets": budgetsForm(); break;
    case "budget-settings": budgetSettingsForm(); break;
    case "new-goal": goalForm(null); break;
    case "edit-goal": goalForm(goal()); break;
    case "goal-save": goalSaveForm(goal()); break;
    case "next-tip": tipIdx++; rerender(); break;
    case "hide-steps": S.ui.hideSteps = true; commit("Tudo isso continua disponível em Ajustes"); break;
    case "change-pw": changePwForm(); break;
    case "peek": peek(el); break;
    case "peek-card": {
      const ps = [...el.closest(".card").querySelectorAll(".peek")], show = ps.some(x => !x.classList.contains("on"));
      ps.forEach(x => peek(x, show));
      el.innerHTML = ic(show ? "eye-off" : "eye"); el.setAttribute("aria-label", show ? "Esconder valores deste quadro" : "Mostrar valores deste quadro");
      break;
    }
    case "toggle-vals": hideVals = !hideVals; applyHide(); rerender(); toast(hideVals ? "Valores escondidos" : "Valores visíveis"); break;
    case "skin": applySkin(el.dataset.s); store.set("ff_skin", skin); rerender(); toast(`Tema ${SKINS[skin].n} aplicado`); break;
    case "notif": Notification.requestPermission().then(() => { commit(); notifyDue(); }); break;
    case "ics": { const ics = buildICS(); if (!ics) { toast("Cadastre contas mensais reais para gerar os lembretes."); break; } download("lembretes-contas.ics", ics, "text/calendar"); S.ui.icsDone = true; commit("Abra o arquivo baixado para adicionar ao calendário"); break; }
    case "export": { const raw = store.get(VAULT_KEY); if (raw) { download(`financas-familia-${isoOf(new Date())}.json`, raw, "application/json"); toast("Cópia criptografada exportada"); } break; }
    case "import": importForm(); break;
    case "clear-examples": confirmBox("Começar com os dados de vocês?", "Contas, gastos, sonhos e renda de exemplo serão removidos. O que vocês cadastraram continua.", "Apagar exemplos", () => {
      const exIds = new Set(S.bills.filter(b => b.ex).map(b => b.id));
      S.bills = S.bills.filter(b => !b.ex); S.exps = S.exps.filter(x => !x.ex); S.goals = S.goals.filter(g => !g.ex);
      Object.keys(S.pays).forEach(k => { if (exIds.has(k.split("|")[0])) delete S.pays[k]; });
      if (S.settings.exIncome) { S.settings.income = 0; S.settings.reserve = 0; S.settings.exIncome = false; }
      S.ach = {};
      commit("Pronto! Agora é com vocês.");
    }, false); break;
    case "wipe": confirmBox("Apagar todos os dados?", "Contas, gastos e histórico deste aparelho serão apagados para sempre. Exporte uma cópia antes, se quiser guardar.", "Apagar tudo", () => {
      store.del(VAULT_KEY); store.del(LOCK_KEY); lockNow("Dados apagados. Entre com o acesso inicial.");
    }); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "sLock" && S) { S.settings.lockMin = +e.target.value; save(); toast(`Bloqueio após ${e.target.value} min parado`); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

if (!window.crypto?.subtle) {
  $app.innerHTML = `<main class="lock"><div class="lock-card"><div class="logo">${ic("home")}</div><h1>Finanças da Família</h1><p class="muted">Abra o app por um endereço seguro (https) ou num navegador atualizado. A criptografia não está disponível aqui.</p></div></main>`;
} else renderLock();
})();
</script>
</body>
</html>
